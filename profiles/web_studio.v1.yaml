email_templates:
  # 1. UK / Formal / Short
  - language: uk
    tone: formal
    length: short
    subject: "Що можна покращити на сайті {domain}"
    body: |
      Добрий день!

      Я переглянув(-ла) сайт {domain} і помітив(-ла) кілька технічних моментів, які можуть знижувати кількість звернень:
      {claims_block}

      Ми допомагаємо з {primary_service}. Можу надіслати стислий звіт із деталями та підказати, з чого варто почати.

      {signature}

      Якщо такі листи для вас неактуальні, дайте знати — я більше не турбуватиму.

  # 2. UK / Formal / Medium
  - language: uk
    tone: formal
    length: medium
    subject: "Спостереження щодо роботи сайту {domain}"
    body: |
      Вітаю!

      Під час короткого технічного огляду сайту {domain} я зафіксував(-ла) конкретні речі, які зараз впливають на досвід відвідувачів та позиції в пошуку:
      {claims_block}

      Наша команда спеціалізується на таких завданнях, зокрема допомагає з {primary_service}. У нас уже підготовлений короткий звіт зі скріншотами та технічними вимірами саме для {domain}.

      Якщо вам цікаво поглянути на перелік пріоритетних виправлень, буду радий(-а) надіслати його у відповідь на цей лист.

      {signature}

      Якщо подібні пропозиції вам не потрібні, просто повідомте, і я більше не писатиму.

  # 3. UK / Friendly / Short
  - language: uk
    tone: friendly
    length: short
    subject: "Декілька ідей для сайту {domain}"
    body: |
      Привіт!

      Зазирнув(-ла) на {domain} і звернув(-ла) увагу на кілька деталей, які легко підправити, щоб не втрачати клієнтів:
      {claims_block}

      Я допомагаю компаніям із {primary_service}. Якщо хочеш, можу скинути короткий звіт із прикладами, щоб було зручно передати в роботу.

      {signature}

      Якщо це зараз не на часі — дай знати, більше не писатиму.

  # 4. UK / Friendly / Medium
  - language: uk
    tone: friendly
    length: medium
    subject: "Помітив(-ла) пару моментів на сайті {domain}"
    body: |
      Доброго дня!

      Переглядав(-ла) ваш сайт {domain} — проєкт виглядає цікаво, але технічна перевірка підсвітила кілька речей, що заважають відвідувачам і пошуковій видачі:
      {claims_block}

      Я займаюся {primary_service} і вже зібрав(-ла) невеликий звіт із доказами та скріншотами саме по вашому сайту, без зайвої «води».

      Підкажіть, чи буде зручно, якщо надішлю цей короткий розбір сюди? Можливо, частину пунктів ваша команда зможе закрити вже цього тижня.

      {signature}

      Якщо такі листи неактуальні — просто напишіть, і я більше не турбуватиму.

  # 5. EN / Formal / Short
  - language: en
    tone: formal
    length: short
    subject: "Quick technical findings for {domain}"
    body: |
      Hello,

      I reviewed {domain} and noticed a few specific technical issues that may be costing you leads:
      {claims_block}

      We help businesses with {primary_service}. I would be glad to share a concise report with screenshots and practical next steps.

      {signature}

      If you prefer not to receive messages like this, please let me know and I will not follow up.

  # 6. EN / Formal / Medium
  - language: en
    tone: formal
    length: medium
    subject: "Technical review observations for {domain}"
    body: |
      Hello,

      While reviewing {domain}, I ran an automated technical check and noticed several concrete areas affecting user experience and search visibility:
      {claims_block}

      Our team specializes in {primary_service}, and I have put together a brief, evidence-based summary with measurements and screenshots specific to {domain}.

      Would you like me to send over the short report so your team can review the highest-impact fixes?

      {signature}

      If this is not relevant for your team, please let me know and I will make sure not to reach out again.

  # 7. EN / Friendly / Short
  - language: en
    tone: friendly
    length: short
    subject: "A couple of quick wins for {domain}"
    body: |
      Hi there,

      I took a quick look at {domain} and spotted a few easy-to-miss issues that could affect visitors:
      {claims_block}

      I work on {primary_service}. Happy to send over a short report with the exact screenshots and numbers if that would be helpful.

      {signature}

      If now isn't a good time, just let me know and I won't follow up.

  # 8. EN / Friendly / Medium
  - language: en
    tone: friendly
    length: medium
    subject: "Spotted a few things to improve on {domain}"
    body: |
      Hi there,

      I was checking out {domain} and noticed a few concrete things under the hood that might be holding back conversions:
      {claims_block}

      I help teams with {primary_service}, and I already saved a quick breakdown with the screenshots and measurements for {domain}.

      Want me to send that short summary over? Even if you handle it in-house, it is a handy checklist to start from.

      {signature}

      If you'd rather not receive emails like this, just reply to let me know and I won't message again.
